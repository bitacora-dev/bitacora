name: CI

on:
  pull_request:
    branches: [development, main]
  push:
    branches: [development, main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # PostgreSQL backend kept green in CI from day one, alongside SQLite,
    # per ADR-0003 — not deferred to "later".
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bitacora
          POSTGRES_PASSWORD: bitacora
          POSTGRES_DB: bitacora_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      BITACORA_TEST_POSTGRES_DSN: postgres://bitacora:bitacora@localhost:5432/bitacora_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install libsystemd-dev
        # internal/collector/journald's Linux reader uses sdjournal (cgo
        # binding over libsystemd) — a scoped, documented exception to
        # ADR-0001's general CGO prohibition. Headers are needed to
        # actually compile and test that file; ubuntu-latest ships the
        # runtime lib but not -dev by default.
        run: sudo apt-get update && sudo apt-get install -y libsystemd-dev

      - name: Build both binaries
        run: go build ./...

      - name: Build Linux amd64 agent with journald
        run: >-
          CGO_ENABLED=1 GOOS=linux GOARCH=amd64
          go build -o dist/bitacora-agent-linux-amd64-journald ./cmd/bitacora-agent

      - name: Verify journald is compiled into the agent
        run: |
          if strings dist/bitacora-agent-linux-amd64-journald | grep -Fq 'requires cgo and libsystemd'; then
            echo 'the journald fallback was compiled into the deployment artifact' >&2
            exit 1
          fi

      - name: Publish Linux amd64 journald agent
        uses: actions/upload-artifact@v4
        with:
          name: bitacora-agent-linux-amd64-journald
          path: dist/bitacora-agent-linux-amd64-journald
          if-no-files-found: error

      - name: Vet
        run: go vet ./...

      - name: Test (collector, storage — SQLite and PostgreSQL, transport, everything else)
        run: go test ./... -race -count=1

      - name: os/exec lint (ADR-0012 — only helpers and bitacora-run may exec)
        run: ./scripts/ci/check-no-exec.sh

      - name: Internal package importer lint
        run: ./scripts/ci/check-internal-importers.sh

      - name: License boundary lint (ADR-0013 / ADR-0018)
        run: ./scripts/ci/check-license-boundary.sh

      - name: Install gitleaks
        # Not gitleaks/gitleaks-action: as of the org-repo licensing change,
        # that action requires a paid GITLEAKS_LICENSE for organizations.
        # The gitleaks CLI itself is free (Apache-2.0); install and run it
        # directly, same invocation used locally.
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1

      - name: gitleaks
        run: gitleaks detect --source . --config .gitleaks.toml --no-git
