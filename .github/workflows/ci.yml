name: CI

on:
  pull_request:
    branches: [development, main]
  push:
    branches: [development, main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build both binaries
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test (collector, storage, transport, everything else)
        run: go test ./... -race -count=1

      - name: os/exec lint (ADR-0012 — only helpers and bitacora-run may exec)
        run: ./scripts/ci/check-no-exec.sh

      - name: Install gitleaks
        # Not gitleaks/gitleaks-action: as of the org-repo licensing change,
        # that action requires a paid GITLEAKS_LICENSE for organizations.
        # The gitleaks CLI itself is free (Apache-2.0); install and run it
        # directly, same invocation used locally.
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1

      - name: gitleaks
        run: gitleaks detect --source . --config .gitleaks.toml --no-git
