name: CI

on:
  pull_request:
    branches: [development, main]
  push:
    branches: [development, main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # PostgreSQL backend kept green in CI from day one, alongside SQLite,
    # per ADR-0003 — not deferred to "later".
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bitacora
          POSTGRES_PASSWORD: bitacora
          POSTGRES_DB: bitacora_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      BITACORA_TEST_POSTGRES_DSN: postgres://bitacora:bitacora@localhost:5432/bitacora_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build both binaries
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test (collector, storage — SQLite and PostgreSQL, transport, everything else)
        run: go test ./... -race -count=1

      - name: os/exec lint (ADR-0012 — only helpers and bitacora-run may exec)
        run: ./scripts/ci/check-no-exec.sh

      - name: Install gitleaks
        # Not gitleaks/gitleaks-action: as of the org-repo licensing change,
        # that action requires a paid GITLEAKS_LICENSE for organizations.
        # The gitleaks CLI itself is free (Apache-2.0); install and run it
        # directly, same invocation used locally.
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1

      - name: gitleaks
        run: gitleaks detect --source . --config .gitleaks.toml --no-git
